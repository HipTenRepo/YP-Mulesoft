# uat: non-secret settings. Secrets live in uat-secure.yaml (encrypted with the uat mule.key).
http:
  host: "0.0.0.0"
  port: "8081"

# HTTPS listener: self-signed server certificate (CloudHub 2.0 last-mile security). Passwords in uat-secure.yaml.
https:
  keystore:
    path: "keystores/yp-https-uat.p12"
    alias: "yp-https"
    type: "pkcs12"

salesforce:
  # YPUAT
  # External Client App consumer key (public identifier, not a secret)
  consumerKey: "3MVG9nDqxWgBl2AeGaF_R4heo4ks_vkT4xZWjFtA1NnnOr5IVF8_9MQpTS8oWupRbsf9K6GVHSMvgLsZQQji_"
  tokenEndpoint: "https://test.salesforce.com/services/oauth2/token"
  audienceUrl: "https://test.salesforce.com"
  principal: "yourpolicy_mulesoft_integration@hipten.com.uat"
  keystore:
    path: "keystores/yp_private_uat.jks"
    alias: "yp_mulesoft_integration"

# API Manager instance this app registers with (autodiscovery). Policies such as Client ID Enforcement are applied there.
api:
  id: "21216714"

# Applied Epic sandbox S1 (P&C data), DevCenter app HiptenSBmockappYOURP02S1V1. Key and secret in uat-secure.yaml.
applied:
  host: "api.myappliedproducts.com"
  tokenPath: "/v1/auth/connect/token"
  audience: "api.myappliedproducts.com/epic"
  responseTimeout: "30000"

# Applied Epic files (epic-files.xml). Links point back at the host Salesforce called, so no public URL is configured.
# frameAncestors = the Lightning domains of YPUAT and YPHTDEV1 (both orgs use this one sandbox app), the only pages allowed
# to frame a preview. Update after a sandbox refresh.
files:
  frameAncestors: "https://your-policy--uat.sandbox.lightning.force.com https://your-policy--uat.sandbox.my.salesforce.com https://your-policy--htdev1.sandbox.lightning.force.com https://your-policy--htdev1.sandbox.my.salesforce.com"
  linkTtlMinutes: "5"
  pageSize: "50"
  folderPageSize: "100"
  # Preview size limit in bytes; 0 = no limit. The limit (5 MB proposed) waits for Your Policy's sign-off.
  previewMaxBytes: "0"
  previewTypes: "pdf,png,jpg,jpeg,gif"
  storageTimeoutMs: "60000"
